name: newsworld
description: NEWWOLD — 新世界
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/splash_image.jpg
    - assets/images/splash_image.png
    - assets/images/ui_select_bg.jpg
    - assets/images/ui_select_bg.png
    - assets/images/login_bg.png
    - assets/images/login_bg.jpg
    - assets/images/terms_bg.jpg
    - assets/images/cctv_baccarat_table.png
    - assets/images/baccarat_table_ref.jpg
    - assets/images/baccarat_home_ui.jpg
